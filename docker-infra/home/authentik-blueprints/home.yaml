# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: Home services
entries:
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Recovery with email verification
      required: false
  - model: authentik_stages_identification.identificationstage
    identifiers:
      name: default-authentication-identification
    attrs:
      user_fields:
        - email
        - username
      recovery_flow: !Find [authentik_flows.flow, [slug, default-recovery-flow]]

  # Logging out of authentik does not end forward_auth sessions: the embedded
  # outpost ignores the session-end signal, so proxy sessions outlive the login.
  # Delete the proxy sessions tied to the login being ended (their `sid` claim
  # is the hashed authentik session key) while the user is still logged in.
  - model: authentik_policies_expression.expressionpolicy
    id: logout-proxy-sessions-policy
    identifiers:
      name: logout-end-proxy-sessions
    attrs:
      expression: |
        from authentik.providers.oauth2.id_token import hash_session_key
        from authentik.providers.proxy.models import ProxySession

        session = getattr(request.http_request, "session", None)
        if session is not None and session.session_key:
            sid = hash_session_key(session.session_key)
            deleted, _ = ProxySession.objects.filter(session_data__claims__sid=sid).delete()
            ak_logger.info("Ended proxy sessions on logout", count=deleted)
        return True
  - model: authentik_policies.policybinding
    identifiers:
      target: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
      order: 0
    attrs:
      policy: !KeyOf logout-proxy-sessions-policy

  - model: authentik_providers_proxy.proxyprovider
    id: navidrome-provider
    identifiers:
      name: Navidrome
    attrs:
      mode: forward_single
      external_host: https://music.vsevolodganin.com
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
  - model: authentik_core.application
    identifiers:
      slug: navidrome
    attrs:
      name: Navidrome
      provider: !KeyOf navidrome-provider
      meta_launch_url: https://music.vsevolodganin.com

  - model: authentik_providers_proxy.proxyprovider
    id: dozzle-provider
    identifiers:
      name: Dozzle
    attrs:
      mode: forward_single
      external_host: https://docker.vsevolodganin.com
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
  - model: authentik_core.application
    id: dozzle-application
    identifiers:
      slug: dozzle
    attrs:
      name: Dozzle
      provider: !KeyOf dozzle-provider
      meta_launch_url: https://docker.vsevolodganin.com
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf dozzle-application
      order: 0
    attrs:
      group: !Find [authentik_core.group, [name, authentik Admins]]

  - model: authentik_providers_proxy.proxyprovider
    id: beets-provider
    identifiers:
      name: Beets
    attrs:
      mode: forward_single
      external_host: https://beets.vsevolodganin.com
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
  - model: authentik_core.application
    identifiers:
      slug: beets
    attrs:
      name: Beets
      provider: !KeyOf beets-provider
      meta_launch_url: https://beets.vsevolodganin.com

  - model: authentik_providers_proxy.proxyprovider
    id: pyload-provider
    identifiers:
      name: pyLoad
    attrs:
      mode: forward_single
      external_host: https://pyload.vsevolodganin.com
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
  - model: authentik_core.application
    identifiers:
      slug: pyload
    attrs:
      name: pyLoad
      provider: !KeyOf pyload-provider
      meta_launch_url: https://pyload.vsevolodganin.com

  - model: authentik_providers_proxy.proxyprovider
    id: filebrowser-provider
    identifiers:
      name: File Browser
    attrs:
      mode: forward_single
      external_host: https://filebrowser.vsevolodganin.com
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
  - model: authentik_core.application
    identifiers:
      slug: filebrowser
    attrs:
      name: File Browser
      provider: !KeyOf filebrowser-provider
      meta_launch_url: https://filebrowser.vsevolodganin.com

  - model: authentik_providers_proxy.proxyprovider
    id: slskd-provider
    identifiers:
      name: slskd
    attrs:
      mode: forward_single
      external_host: https://slsk.vsevolodganin.com
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
  - model: authentik_core.application
    identifiers:
      slug: slskd
    attrs:
      name: slskd
      provider: !KeyOf slskd-provider
      meta_launch_url: https://slsk.vsevolodganin.com

  - model: authentik_providers_proxy.proxyprovider
    id: qbittorrent-provider
    identifiers:
      name: qBittorrent
    attrs:
      mode: forward_single
      external_host: https://torrent.vsevolodganin.com
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
  - model: authentik_core.application
    identifiers:
      slug: qbittorrent
    attrs:
      name: qBittorrent
      provider: !KeyOf qbittorrent-provider
      meta_launch_url: https://torrent.vsevolodganin.com

  - model: authentik_providers_oauth2.scopemapping
    id: email-verified-scope-mapping
    identifiers:
      name: "OpenID 'email' with email_verified"
    attrs:
      scope_name: email
      description: Email address
      expression: |
        return {
            "email": request.user.email,
            "email_verified": True,
        }

  - model: authentik_providers_oauth2.oauth2provider
    id: beszel-provider
    identifiers:
      name: Beszel
    attrs:
      client_type: confidential
      grant_types:
        - authorization_code
        - refresh_token
      client_id: beszel
      client_secret: !File /run/secrets/beszel-oidc-client-secret
      redirect_uris:
        - matching_mode: strict
          url: https://beszel.vsevolodganin.com/api/oauth2-redirect
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !KeyOf email-verified-scope-mapping
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
  - model: authentik_core.application
    identifiers:
      slug: beszel
    attrs:
      name: Beszel
      provider: !KeyOf beszel-provider
      meta_launch_url: https://beszel.vsevolodganin.com

  - model: authentik_providers_proxy.proxyprovider
    id: lidarr-provider
    identifiers:
      name: Lidarr
    attrs:
      mode: forward_single
      external_host: https://lidarr.vsevolodganin.com
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
  - model: authentik_core.application
    identifiers:
      slug: lidarr
    attrs:
      name: Lidarr
      provider: !KeyOf lidarr-provider
      meta_launch_url: https://lidarr.vsevolodganin.com

  - model: authentik_providers_oauth2.oauth2provider
    id: open-webui-provider
    identifiers:
      name: Open WebUI
    attrs:
      client_type: confidential
      grant_types:
        - authorization_code
        - refresh_token
      client_id: open-webui
      # Compose secret mounted on authentik-server and authentik-worker.
      client_secret: !File /run/secrets/open-webui-oidc-client-secret
      redirect_uris:
        - matching_mode: strict
          url: https://ai.vsevolodganin.com/oauth/oidc/callback
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      property_mappings:
        - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
  - model: authentik_core.application
    identifiers:
      slug: open-webui
    attrs:
      name: Open WebUI
      provider: !KeyOf open-webui-provider
      meta_launch_url: https://ai.vsevolodganin.com

  - model: authentik_outposts.outpost
    identifiers:
      managed: goauthentik.io/outposts/embedded
    attrs:
      config:
        authentik_host: https://auth.vsevolodganin.com
      providers:
        - !KeyOf navidrome-provider
        - !KeyOf dozzle-provider
        - !KeyOf beets-provider
        - !KeyOf pyload-provider
        - !KeyOf filebrowser-provider
        - !KeyOf slskd-provider
        - !KeyOf qbittorrent-provider
        - !KeyOf lidarr-provider
