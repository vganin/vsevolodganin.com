# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: Home services
entries:
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Recovery with email verification
      required: false
  - model: authentik_stages_identification.identificationstage
    identifiers:
      name: default-authentication-identification
    attrs:
      user_fields:
        - email
        - username
      recovery_flow: !Find [authentik_flows.flow, [slug, default-recovery-flow]]

  - model: authentik_providers_proxy.proxyprovider
    id: navidrome-provider
    identifiers:
      name: Navidrome
    attrs:
      mode: forward_single
      external_host: https://music.vsevolodganin.com
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
  - model: authentik_core.application
    identifiers:
      slug: navidrome
    attrs:
      name: Navidrome
      provider: !KeyOf navidrome-provider
      meta_launch_url: https://music.vsevolodganin.com

  - model: authentik_providers_proxy.proxyprovider
    id: dozzle-provider
    identifiers:
      name: Dozzle
    attrs:
      mode: forward_single
      external_host: https://docker.vsevolodganin.com
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
  - model: authentik_core.application
    id: dozzle-application
    identifiers:
      slug: dozzle
    attrs:
      name: Dozzle
      provider: !KeyOf dozzle-provider
      meta_launch_url: https://docker.vsevolodganin.com
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf dozzle-application
      order: 0
    attrs:
      group: !Find [authentik_core.group, [name, authentik Admins]]

  - model: authentik_providers_proxy.proxyprovider
    id: beets-provider
    identifiers:
      name: Beets
    attrs:
      mode: forward_single
      external_host: https://beets.vsevolodganin.com
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
  - model: authentik_core.application
    identifiers:
      slug: beets
    attrs:
      name: Beets
      provider: !KeyOf beets-provider
      meta_launch_url: https://beets.vsevolodganin.com

  - model: authentik_providers_proxy.proxyprovider
    id: pyload-provider
    identifiers:
      name: pyLoad
    attrs:
      mode: forward_single
      external_host: https://pyload.vsevolodganin.com
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
  - model: authentik_core.application
    identifiers:
      slug: pyload
    attrs:
      name: pyLoad
      provider: !KeyOf pyload-provider
      meta_launch_url: https://pyload.vsevolodganin.com

  - model: authentik_outposts.outpost
    identifiers:
      managed: goauthentik.io/outposts/embedded
    attrs:
      config:
        authentik_host: https://auth.vsevolodganin.com
      providers:
        - !KeyOf navidrome-provider
        - !KeyOf dozzle-provider
        - !KeyOf beets-provider
        - !KeyOf pyload-provider
