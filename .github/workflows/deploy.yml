name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: "deploy"
  cancel-in-progress: false

jobs:
  home:
    runs-on: ubuntu-latest

    steps:
      - name: SSH and deploy
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HOME_SSH_ENDPOINT }}
          port: ${{ secrets.HOME_SSH_PORT }}
          username: ${{ secrets.HOME_SSH_USER }}
          key: ${{ secrets.HOME_SSH_KEY }}
          script: |
            set -e
            cd /home/vsga/vsevolodganin.com/docker-infra/home
            git pull origin main
            # Caddyfile is a single-file bind mount: git replaces the file, so the
            # running container keeps the old inode until restarted. Restart it
            # before recreating apps, so SSO is in front before app auth relaxes.
            if ! docker compose exec -T caddy cat /etc/caddy/Caddyfile | cmp -s - Caddyfile; then
              docker compose restart caddy
            fi
            services=$(docker compose ps --services --status running)
            if [ -z "$services" ]; then
              echo "No running services, skipping container refresh"
              exit 0
            fi
            docker compose pull $services
            docker compose up -d --build --no-deps --remove-orphans $services
